name: Verify and publish alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android tools
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'Android SDK setup failed'}
      - name: JVM regressions
        shell: pwsh
        run: ./test.ps1
      - name: All campaign simulations
        shell: pwsh
        run: ./simulate-progression.ps1
      - name: Compile app source
        shell: pwsh
        run: ./build.ps1
      - name: Verify exact distribution artifact
        shell: pwsh
        run: ./verify-alpha.ps1
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact APK and instructions
        shell: bash
        run: |
          set -euo pipefail
          cd distribution
          sha256sum --check SHA256SUMS.txt
          cd ..
          mkdir -p alpha-kit release-assets
          cp distribution/OpenRow-0.22.0-alpha.1.apk alpha-kit/
          cp docs/ALPHA-INSTALL.md alpha-kit/START-HERE.md
          cp docs/ALPHA-TEST-CHECKLIST.md docs/PRIVACY.md docs/PVV-ALPHA-1.md Install-Windows.ps1 alpha-kit/
          (cd alpha-kit && sha256sum *.apk *.md *.ps1 > SHA256SUMS.txt)
          (cd alpha-kit && zip -q ../release-assets/OpenRow-0.22.0-alpha.1-install-kit.zip ./*)
          cp distribution/*.apk docs/PVV-ALPHA-1.md release-assets/
          (cd release-assets && sha256sum *.apk *.zip PVV-ALPHA-1.md > SHA256SUMS.txt)
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.22.0-alpha.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Alpha tag already published; refusing to replace its verified assets.'
            exit 0
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --prerelease --title 'OpenRow 0.22.0-alpha.1 — first private alpha' --notes-file docs/ALPHA-RELEASE-NOTES.md
